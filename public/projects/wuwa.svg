<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c0e"/>
      <stop offset="1" stop-color="#030405"/>
    </linearGradient>
    <pattern id="grid-p" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1d21" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg-p)"/>
  <rect width="1600" height="900" fill="url(#grid-p)"/>

  <g font-family="ui-monospace, monospace" fill="#d8cfc4">
    <text x="80" y="100" font-size="22" font-weight="700" letter-spacing="3" fill="#c9973f">WUTHERING WAVES · PRIVATE SERVER</text>
    <text x="80" y="128" font-size="13" letter-spacing="2" fill="#7a6f63">RE-IMPLEMENTATION · .NET 8 · KCP · PROTOBUF · CODENAME: OWN FATE</text>
    <line x1="80" y1="148" x2="1520" y2="148" stroke="#1a1d21" stroke-width="1"/>

    <!-- architecture diagram -->
    <g transform="translate(80,200)" font-size="11">
      <text x="0" y="0" font-size="11" letter-spacing="3" fill="#7a6f63">// ARCHITECTURE</text>

      <!-- client -->
      <g transform="translate(0,40)">
        <rect x="0" y="0" width="200" height="80" fill="#0a0c0e" stroke="#c9973f" stroke-width="1.5"/>
        <text x="100" y="34" text-anchor="middle" font-size="13" fill="#d8cfc4">GAME CLIENT</text>
        <text x="100" y="56" text-anchor="middle" font-size="10" fill="#7a6f63">not provided</text>
      </g>
      <!-- sdk server -->
      <g transform="translate(280,40)">
        <rect x="0" y="0" width="240" height="80" fill="#0a0c0e" stroke="#7fae9e" stroke-width="1.5"/>
        <text x="120" y="34" text-anchor="middle" font-size="13" fill="#d8cfc4">SDK SERVER</text>
        <text x="120" y="56" text-anchor="middle" font-size="10" fill="#7a6f63">ASP.NET Core · HTTP</text>
      </g>
      <!-- game server -->
      <g transform="translate(600,40)">
        <rect x="0" y="0" width="280" height="80" fill="#0a0c0e" stroke="#c9973f" stroke-width="1.5"/>
        <text x="140" y="34" text-anchor="middle" font-size="13" fill="#d8cfc4">GAME SERVER</text>
        <text x="140" y="56" text-anchor="middle" font-size="10" fill="#7a6f63">KCP gateway · protobuf</text>
      </g>
      <!-- traffic analyzer -->
      <g transform="translate(960,40)">
        <rect x="0" y="0" width="240" height="80" fill="#0a0c0e" stroke="#9c6f8e" stroke-width="1.5"/>
        <text x="120" y="34" text-anchor="middle" font-size="13" fill="#d8cfc4">TRAFFIC ANALYZER</text>
        <text x="120" y="56" text-anchor="middle" font-size="10" fill="#7a6f63">.pcap · pbf inspector</text>
      </g>
      <!-- shared libs -->
      <g transform="translate(1280,40)">
        <rect x="0" y="0" width="220" height="80" fill="#0a0c0e" stroke="#1a1d21" stroke-width="1.5"/>
        <text x="110" y="34" text-anchor="middle" font-size="13" fill="#d8cfc4">Core · Protocol</text>
        <text x="110" y="56" text-anchor="middle" font-size="10" fill="#7a6f63">KcpSharp · protobuf</text>
      </g>

      <!-- arrows -->
      <g stroke="#c9973f" stroke-width="1.5" fill="none" marker-end="url(#arrow-p)">
        <defs>
          <marker id="arrow-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#c9973f"/>
          </marker>
        </defs>
        <line x1="200" y1="80" x2="280" y2="80"/>
        <line x1="520" y1="80" x2="600" y2="80"/>
        <line x1="880" y1="80" x2="960" y2="80" stroke-dasharray="4 3"/>
      </g>
    </g>

    <!-- packet capture / protobuf trace -->
    <g transform="translate(80,360)">
      <text x="0" y="0" font-size="11" letter-spacing="3" fill="#c9973f">▌ PACKET TRACE · KCP STREAM</text>
      <g transform="translate(0,20)" font-size="11">
        <rect x="0" y="0" width="700" height="280" fill="#0a0c0e" stroke="#1a1d21"/>
        <text x="14" y="22" font-size="10" letter-spacing="2" fill="#7a6f63">// tcpdump -X -r session_240813.pcap | grep PlayerLoginReq</text>
        <g font-size="11" fill="#d8cfc4">
          <text x="14" y="50">14:32:08.221  <tspan fill="#c9973f">10:13:37:a2</tspan> → <tspan fill="#7fae9e">gw01.local</tspan>  KCP  conv=0x4F2A1B</text>
          <text x="14" y="74">  cmd=0x04E1  body_len=412  cmd_id=<tspan fill="#c9973f">PlayerLoginReq</tspan></text>
          <text x="14" y="98">  0000  08 01 12 1f 6c 6f 67 69  6e 5f 74 6f 6b 65 6e 5f  |...login_token_</text>
          <text x="14" y="118">  0010  33 39 32 38 65 66 37 22  0d 31 39 32 2e 31 36 38  |3928ef7".192.168</text>
          <text x="14" y="138">  0020  2e 31 2e 32 32 3a 35 34  33 32 31 2a 14 63 6c 69  |.1.22:54321*.cli</text>
          <text x="14" y="158">  0030  65 6e 74 5f 76 65 72 73  69 6f 6e 5f 32 2e 34 2e  |ent_version_2.4.</text>
          <text x="14" y="178">  0040  31 30 30 32 32 30 31 30  37 33 39 32 38 65 66 37  |1002201073928ef7</text>
          <text x="14" y="206" font-size="10" letter-spacing="2" fill="#7a6f63">// decoded PlayerLoginReq → { token, client_ip, version }</text>
          <text x="14" y="228" fill="#7fae9e">[200 OK] scene_token=e9c2..f7  uid=1094201133</text>
          <text x="14" y="252" fill="#d8cfc4">→ dispatch PlayerEnterSceneReq → scene_id=42 (Jinzhou)</text>
        </g>
      </g>

      <!-- right: module breakdown -->
      <g transform="translate(740,20)">
        <rect x="0" y="0" width="740" height="280" fill="#0a0c0e" stroke="#1a1d21"/>
        <text x="14" y="22" font-size="10" letter-spacing="2" fill="#7a6f63">// SOLUTION</text>
        <g font-size="11" fill="#d8cfc4">
          <text x="14" y="50"><tspan fill="#c9973f">Core</tspan>            shared infrastructure · config · extensions</text>
          <text x="14" y="74"><tspan fill="#c9973f">Protocol</tspan>        protobuf contracts · message catalog</text>
          <text x="14" y="98"><tspan fill="#c9973f">KcpSharp</tspan>        KCP transport · fast reliable UDP</text>
          <text x="14" y="122"><tspan fill="#c9973f">GameServer</tspan>     KCP gateway · controllers · gameplay</text>
          <text x="14" y="146"><tspan fill="#c9973f">SDKServer</tspan>      HTTP login · hot-patch · base config</text>
          <text x="14" y="170"><tspan fill="#c9973f">TrafficAnalyzer</tspan> capture replay · opcode inspector</text>
        </g>
        <line x1="14" y1="190" x2="726" y2="190" stroke="#1a1d21"/>
        <text x="14" y="214" font-size="10" letter-spacing="2" fill="#b3554a">⚠ research only · not affiliated with Kuro Game Studio</text>
        <text x="14" y="240" font-size="11" fill="#d8cfc4">teleport via map mark · configurable starting state</text>
        <text x="14" y="260" font-size="11" fill="#d8cfc4">unlimited energy · patch overrides · modular controllers</text>
      </g>
    </g>

    <line x1="80" y1="820" x2="1520" y2="820" stroke="#1a1d21"/>
    <g font-size="11" letter-spacing="2" fill="#7a6f63">
      <text x="80" y="850">RESEARCH / LEARNING · .NET 8 · PROTOBUF · KCP</text>
      <text x="1300" y="850" fill="#c9973f">▣ OWN FATE</text>
    </g>
  </g>
</svg>
