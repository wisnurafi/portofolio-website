<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-u" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c0e"/>
      <stop offset="1" stop-color="#030405"/>
    </linearGradient>
    <pattern id="grid-u" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1d21" stroke-width="1"/>
    </pattern>
    <filter id="glow-u"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg-u)"/>
  <rect width="1600" height="900" fill="url(#grid-u)"/>
  <!-- schematic: registry tree + scan bar -->
  <g font-family="ui-monospace, monospace" fill="#d8cfc4">
    <text x="80" y="100" font-size="22" font-weight="700" letter-spacing="3" fill="#c9973f">UNINSTRA</text>
    <text x="80" y="128" font-size="13" letter-spacing="2" fill="#7a6f63">EVIDENCE-BASED UNINSTALLER · WPF · .NET 9</text>
    <line x1="80" y1="148" x2="1520" y2="148" stroke="#1a1d21" stroke-width="1"/>

    <!-- left: registry tree -->
    <g transform="translate(80,190)">
      <text x="0" y="0" font-size="11" letter-spacing="2" fill="#7a6f63">// HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall</text>
      <g font-size="13" fill="#d8cfc4">
        <text x="20" y="40">├─ 7-Zip <tspan fill="#b3554a">[orphan]</tspan></text>
        <text x="40" y="68">├─ C:\Program Files\7-Zip\7z.exe <tspan fill="#b3554a">missing</tspan></text>
        <text x="40" y="92">├─ HKCR\7z.zip\shell\open <tspan fill="#c9973f">stale</tspan></text>
        <text x="20" y="124">├─ Notepad++ <tspan fill="#7fae9e">[ok]</tspan></text>
        <text x="40" y="152">├─ C:\Program Files\Notepad++\notepad++.exe <tspan fill="#7fae9e">present</tspan></text>
        <text x="20" y="184">├─ OldGameLauncher <tspan fill="#b3554a">[orphan]</tspan></text>
        <text x="40" y="212">├─ HKLM\...\Run\OldGame <tspan fill="#c9973f">residual</tspan></text>
        <text x="40" y="236">├─ C:\Users\*\AppData\Roaming\oldgame <tspan fill="#b3554a">146 MB</tspan></text>
        <text x="20" y="268">└─ DriverEasy <tspan fill="#7fae9e">[ok]</tspan></text>
      </g>
    </g>

    <!-- right: confidence scoring -->
    <g transform="translate(900,190)">
      <text x="0" y="0" font-size="11" letter-spacing="2" fill="#7a6f63">// CONFIDENCE SCORING · MULTI-SIGNAL</text>
      <g font-size="12">
        <text x="0" y="34" fill="#d8cfc4">missing_executable   </text><rect x="180" y="24" width="220" height="14" fill="#1a1d21"/><rect x="180" y="24" width="198" height="14" fill="#b3554a" opacity="0.7"/>
        <text x="0" y="64" fill="#d8cfc4">broken_uninstall_key  </text><rect x="180" y="54" width="220" height="14" fill="#1a1d21"/><rect x="180" y="54" width="176" height="14" fill="#c9973f" opacity="0.7"/>
        <text x="0" y="94" fill="#d8cfc4">orphan_appdata        </text><rect x="180" y="84" width="220" height="14" fill="#1a1d21"/><rect x="180" y="84" width="220" height="14" fill="#b3554a" opacity="0.7"/>
        <text x="0" y="124" fill="#d8cfc4">stale_shell_ext       </text><rect x="180" y="114" width="220" height="14" fill="#1a1d21"/><rect x="180" y="114" width="110" height="14" fill="#c9973f" opacity="0.7"/>
        <text x="0" y="154" fill="#d8cfc4">service_stub          </text><rect x="180" y="144" width="220" height="14" fill="#1a1d21"/><rect x="180" y="144" width="44" height="14" fill="#7fae9e" opacity="0.7"/>
      </g>

      <!-- result panel -->
      <g transform="translate(0,200)">
        <rect x="0" y="0" width="540" height="280" fill="#0a0c0e" stroke="#1a1d21"/>
        <text x="14" y="28" font-size="11" letter-spacing="2" fill="#c9973f">▌ FORCIBLE UNINSTALL — 7-Zip</text>
        <text x="14" y="60" font-size="12" fill="#d8cfc4">target:</text><text x="80" y="60" fill="#7fae9e">C:\Program Files\7-Zip\</text>
        <text x="14" y="84" font-size="12" fill="#d8cfc4">residual:</text><text x="80" y="84" fill="#b3554a">14 keys · 23 files · 146 MB</text>
        <text x="14" y="108" font-size="12" fill="#d8cfc4">score  :</text><text x="80" y="108" fill="#b3554a">0.94 HIGH CONFIDENCE</text>
        <text x="14" y="144" font-size="11" letter-spacing="2" fill="#7a6f63">// QUARANTINE PREVIEW</text>
        <g font-size="11" fill="#d8cfc4">
          <text x="14" y="172">→ .quarantine/7z/a1.exe         (12.4 MB)</text>
          <text x="14" y="192">→ .quarantine/7z/ext/7z.dll      (3.1 MB)</text>
          <text x="14" y="212">→ .quarantine/7z/keys/HKCR.json (4.2 KB)</text>
          <text x="14" y="232">→ .quarantine/7z/appdata/...    (129 MB)</text>
        </g>
        <text x="14" y="262" font-size="11" fill="#c9973f">[ENTER] confirm   [ESC] abort</text>
      </g>
    </g>

    <!-- bottom status -->
    <line x1="80" y1="820" x2="1520" y2="820" stroke="#1a1d21"/>
    <g font-size="11" letter-spacing="2" fill="#7a6f63">
      <text x="80" y="850">SQLITE · MVVM · CLEAN ARCH · OFFLINE</text>
      <text x="1300" y="850" fill="#c9973f">▣ BUILD 1.4.2</text>
    </g>
  </g>
</svg>
