<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c0e"/>
      <stop offset="1" stop-color="#030405"/>
    </linearGradient>
    <pattern id="grid-w" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1d21" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg-w)"/>
  <rect width="1600" height="900" fill="url(#grid-w)"/>
  <g font-family="ui-monospace, monospace" fill="#d8cfc4">
    <text x="80" y="100" font-size="22" font-weight="700" letter-spacing="3" fill="#c9973f">WIN MEMORY CLEANER</text>
    <text x="80" y="128" font-size="13" letter-spacing="2" fill="#7a6f63">NATIVE RAM OPTIMIZER · WPF · .NET FRAMEWORK · MVVM</text>
    <line x1="80" y1="148" x2="1520" y2="148" stroke="#1a1d21" stroke-width="1"/>

    <!-- big memory bar -->
    <g transform="translate(80,200)">
      <text x="0" y="0" font-size="11" letter-spacing="2" fill="#7a6f63">// PHYSICAL MEMORY · 32.0 GB</text>
      <rect x="0" y="20" width="1440" height="46" fill="#0a0c0e" stroke="#1a1d21"/>
      <rect x="0" y="20" width="1080" height="46" fill="#c9973f" opacity="0.18"/>
      <rect x="0" y="20" width="360" height="46" fill="#7fae9e" opacity="0.5"/>
      <line x1="1080" y1="14" x2="1080" y2="72" stroke="#c9973f" stroke-width="1.5"/>
      <text x="1088" y="80" font-size="11" fill="#c9973f">USED 24.1 GB · 75%</text>
      <text x="12" y="50" font-size="14" fill="#d8cfc4">IN-USE  24.1G</text>
      <text x="1100" y="50" font-size="14" fill="#0a0c0e" font-weight="700">FREE 7.9G</text>
    </g>

    <!-- memory area stats -->
    <g transform="translate(80,320)" font-size="12">
      <text x="0" y="0" font-size="11" letter-spacing="2" fill="#7a6f63">// NATIVE API · MEMORY AREAS</text>
      <g transform="translate(0,20)">
        <rect x="0" y="0" width="460" height="68" fill="#0a0c0e" stroke="#1a1d21"/>
        <text x="14" y="24" fill="#d8cfc4">Standby List</text>
        <text x="14" y="50" fill="#c9973f">8.42 GB</text>
        <rect x="220" y="14" width="220" height="10" fill="#1a1d21"/><rect x="220" y="14" width="170" height="10" fill="#c9973f" opacity="0.7"/>
        <text x="220" y="44" font-size="10" fill="#7a6f63">SetSystemFileCacheSize · NtSetSystemInformation</text>
      </g>
      <g transform="translate(490,20)">
        <rect x="0" y="0" width="460" height="68" fill="#0a0c0e" stroke="#1a1d21"/>
        <text x="14" y="24" fill="#d8cfc4">Low Priority Standby</text>
        <text x="14" y="50" fill="#c9973f">3.10 GB</text>
        <rect x="220" y="14" width="220" height="10" fill="#1a1d21"/><rect x="220" y="14" width="68" height="10" fill="#7fae9e" opacity="0.7"/>
        <text x="220" y="44" font-size="10" fill="#7a6f63">MemoryPurgeStandbyList</text>
      </g>
      <g transform="translate(980,20)">
        <rect x="0" y="0" width="460" height="68" fill="#0a0c0e" stroke="#1a1d21"/>
        <text x="14" y="24" fill="#d8cfc4">Modified Page List</text>
        <text x="14" y="50" fill="#c9973f">412 MB</text>
        <rect x="220" y="14" width="220" height="10" fill="#1a1d21"/><rect x="220" y="14" width="14" height="10" fill="#b3554a" opacity="0.7"/>
        <text x="220" y="44" font-size="10" fill="#7a6f63">NtSetSystemInformation · SysLkInfo</text>
      </g>
    </g>

    <!-- process exclusion + hotkey -->
    <g transform="translate(80,440)">
      <text x="0" y="0" font-size="11" letter-spacing="2" fill="#7a6f63">// PROCESS EXCLUSION LIST</text>
      <g transform="translate(0,20)">
        <rect x="0" y="0" width="700" height="280" fill="#0a0c0e" stroke="#1a1d21"/>
        <g font-size="12" fill="#d8cfc4">
          <text x="14" y="28">▸ devenv.exe            <tspan fill="#7a6f63">— IDE, never trim</tspan></text>
          <text x="14" y="58">▸ vmware-vmx.exe        <tspan fill="#7a6f63">— VM host</tspan></text>
          <text x="14" y="88">▸ obs64.exe             <tspan fill="#7a6f63">— capture in progress</tspan></text>
          <text x="14" y="118">▸ sqlservr.exe          <tspan fill="#7a6f63">— production</tspan></text>
          <text x="14" y="148">▸ chrome.exe            <tspan fill="#7a6f63">— pinned tabs</tspan></text>
          <text x="14" y="178">▸ notepad++.exe         <tspan fill="#7a6f63">— unsaved buffers</tspan></text>
        </g>
        <text x="14" y="240" font-size="11" letter-spacing="2" fill="#7a6f63">add: psapi.EnumProcesses · WMI query</text>
      </g>

      <g transform="translate(740,20)">
        <rect x="0" y="0" width="700" height="280" fill="#0a0c0e" stroke="#1a1d21"/>
        <text x="14" y="28" font-size="11" letter-spacing="2" fill="#c9973f">▌ GLOBAL HOTKEY · CTRL+ALT+M</text>
        <text x="14" y="62" font-size="12" fill="#d8cfc4">RegisterHotKey(hWnd, 0x001A, MOD_CONTROL|MOD_ALT, 0x4D)</text>
        <text x="14" y="92" font-size="12" fill="#d8cfc4">→ runs optimization across all enabled areas</text>

        <text x="14" y="140" font-size="11" letter-spacing="2" fill="#7a6f63">// AUTO-OPTIMIZE TRIGGERS</text>
        <g font-size="12">
          <text x="14" y="168" fill="#d8cfc4">interval</text><text x="220" y="168" fill="#c9973f">every 15 min</text>
          <text x="14" y="196" fill="#d8cfc4">threshold</text><text x="220" y="196" fill="#c9973f">RAM &gt; 85%</text>
          <text x="14" y="224" fill="#d8cfc4">startup</text><text x="220" y="224" fill="#7fae9e">enabled · minimized</text>
          <text x="14" y="252" fill="#d8cfc4">priority</text><text x="220" y="252" fill="#d8cfc4">high</text>
        </g>
      </g>
    </g>

    <line x1="80" y1="820" x2="1520" y2="820" stroke="#1a1d21"/>
    <g font-size="11" letter-spacing="2" fill="#7a6f63">
      <text x="80" y="850">SYSTEM TRAY · 25 LOCALES · ADMIN REQUIRED</text>
      <text x="1300" y="850" fill="#c9973f">▣ READY</text>
    </g>
  </g>
</svg>
